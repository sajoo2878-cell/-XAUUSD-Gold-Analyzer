name: xauusd-auto.yml

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest

    steps:
      - name: Analyze XAUUSD
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}

        run: |
          node <<'NODE'

          const PRICE_URL =
            "https://biquote.io/api/XAUUSD?allowStale=true";

          const OHLC_URL =
            "https://biquote.io/api/XAUUSD/ohlc?interval=5m&limit=300";

          const APP_ID =
            "092fc306-c2ab-4a85-a3f9-ff8b50dd8833";

          const SUBSCRIPTION_ID =
            "cdcd03a6-7830-4621-9178-8fb9cc306b8e";

          const API_KEY =
            process.env.ONESIGNAL_REST_API_KEY;


          async function getJSON(url) {

            const response = await fetch(url);

            if (!response.ok) {
              throw new Error(
                `HTTP ${response.status} - ${url}`
              );
            }

            return await response.json();
          }


          function sma(data, period) {

            if (data.length < period) {
              return null;
            }

            let sum = 0;

            for (
              let i = data.length - period;
              i < data.length;
              i++
            ) {
              sum += data[i];
            }

            return sum / period;
          }


          function ema(data, period) {

            if (data.length < period) {
              return null;
            }

            const k = 2 / (period + 1);

            let value =
              sma(
                data.slice(0, period),
                period
              );

            for (
              let i = period;
              i < data.length;
              i++
            ) {
              value =
                data[i] * k +
                value * (1 - k);
            }

            return value;
          }


          function rsi(data, period = 14) {

            if (data.length < period + 1) {
              return 50;
            }

            let gain = 0;
            let loss = 0;

            for (
              let i = data.length - period;
              i < data.length;
              i++
            ) {

              const change =
                data[i] - data[i - 1];

              if (change > 0) {
                gain += change;
              } else {
                loss += Math.abs(change);
              }
            }

            if (loss === 0) {
              return 100;
            }

            const rs =
              gain / loss;

            return 100 -
              100 / (1 + rs);
          }


          function calculateSignal(closes) {

            let score = 0;


            const ema9 =
              ema(closes, 9);

            const ema21 =
              ema(closes, 21);


            if (
              ema9 !== null &&
              ema21 !== null
            ) {

              if (ema9 > ema21) {
                score += 2;
              }

              if (ema9 < ema21) {
                score -= 2;
              }
            }


            const sma20 =
              sma(closes, 20);

            const sma50 =
              sma(closes, 50);


            if (
              sma20 !== null &&
              sma50 !== null
            ) {

              if (sma20 > sma50) {
                score += 2;
              }

              if (sma20 < sma50) {
                score -= 2;
              }
            }


            const currentRSI =
              rsi(closes, 14);


            if (currentRSI > 55) {
              score += 1;
            }

            if (currentRSI < 45) {
              score -= 1;
            }


            let signal = "WAIT";


            if (score >= 4) {
              signal = "BUY";
            }

            if (score <= -4) {
              signal = "SELL";
            }


            return {
              score,
              signal,
              rsi: currentRSI
            };
          }


          function calculateLevels(
            bars,
            price,
            signal
          ) {

            const recent =
              bars.slice(-60);


            const highs =
              recent.map(
                candle => candle.high
              );


            const lows =
              recent.map(
                candle => candle.low
              );


            const resistance =
              Math.max(...highs);


            const support =
              Math.min(...lows);


            let sl;
            let tp1;
            let tp2;


            if (signal === "BUY") {

              sl =
                support < price
                ? support - 1.5
                : price - 5;


              const risk =
                price - sl;


              tp1 =
                price + risk * 1.5;


              tp2 =
                price + risk * 2.2;

            } else {

              sl =
                resistance > price
                ? resistance + 1.5
                : price + 5;


              const risk =
                sl - price;


              tp1 =
                price - risk * 1.5;


              tp2 =
                price - risk * 2.2;
            }


            return {
              sl,
              tp1,
              tp2
            };
          }


          async function sendNotification(message) {

            if (!API_KEY) {

              throw new Error(
                "ONESIGNAL_REST_API_KEY is missing"
              );
            }


            const response =
              await fetch(
                "https://api.onesignal.com/notifications",
                {
                  method: "POST",

                  headers: {
                    "Authorization":
                      "Key " + API_KEY,

                    "Content-Type":
                      "application/json"
                  },

                  body: JSON.stringify({

                    app_id:
                      APP_ID,

                    include_subscription_ids:
                      [
                        SUBSCRIPTION_ID
                      ],

                    headings: {
                      en:
                        "XAUUSD Signal Bot"
                    },

                    contents: {
                      en:
                        message
                    }

                  })
                }
              );


            const result =
              await response.text();


            console.log(
              "OneSignal response:",
              result
            );


            if (!response.ok) {

              throw new Error(
                "OneSignal HTTP " +
                response.status
              );
            }
          }


          async function main() {

            console.log(
              "================================"
            );

            console.log(
              "XAUUSD SIGNAL BOT STARTED"
            );

            console.log(
              "================================"
            );


            const priceData =
              await getJSON(
                PRICE_URL
              );


            const price =
              Number(
                priceData.mid ??
                priceData.bid ??
                priceData.ask ??
                priceData.last
              );


            if (!Number.isFinite(price)) {

              throw new Error(
                "XAUUSD price not found"
              );
            }


            console.log(
              "XAUUSD Price:",
              price
            );


            const ohlc =
              await getJSON(
                OHLC_URL
              );


            if (
              !ohlc.bars ||
              !Array.isArray(
                ohlc.bars
              )
            ) {

              throw new Error(
                "OHLC bars not found"
              );
            }


            const bars =
              ohlc.bars
                .filter(
                  candle =>
                    !candle.isOpen
                )
                .map(
                  candle => ({
                    open:
                      Number(
                        candle.open
                      ),

                    high:
                      Number(
                        candle.high
                      ),

                    low:
                      Number(
                        candle.low
                      ),

                    close:
                      Number(
                        candle.close
                      )
                  })
                );


            if (bars.length < 110) {

              throw new Error(
                "Not enough candles: " +
                bars.length
              );
            }


            const closes =
              bars.map(
                candle =>
                  candle.close
              );


            const current =
              calculateSignal(
                closes
              );


            const previousCloses =
              closes.slice(
                0,
                closes.length - 1
              );


            const previous =
              calculateSignal(
                previousCloses
              );


            console.log(
              "Current score:",
              current.score
            );


            console.log(
              "Previous score:",
              previous.score
            );


            console.log(
              "Current signal:",
              current.signal
            );


            console.log(
              "Previous signal:",
              previous.signal
            );


            if (
              current.signal === "WAIT"
            ) {

              console.log(
                "WAIT - no notification"
              );

              return;
            }


            if (
              current.signal ===
              previous.signal
            ) {

              console.log(
                "Same signal - no notification"
              );

              return;
            }


            const levels =
              calculateLevels(
                bars,
                price,
                current.signal
              );


            const confidence =
              Math.min(
                95,
                50 +
                Math.abs(
                  current.score
                ) * 7
              );


            const message =

              (
                current.signal === "BUY"
                ? "🟢 XAUUSD BUY SIGNAL"
                : "🔴 XAUUSD SELL SIGNAL"
              )

              + "\n\n"

              + "📍 Entry: "
              + price.toFixed(2)

              + "\n🛑 SL: "
              + levels.sl.toFixed(2)

              + "\n🎯 TP1: "
              + levels.tp1.toFixed(2)

              + "\n🎯 TP2: "
              + levels.tp2.toFixed(2)

              + "\n💪 Confidence: "
              + confidence
              + "%"

              + "\n📊 RSI: "
              + current.rsi.toFixed(1)

              + "\n📈 Score: "
              + current.score

              + "\n\n⏰ XAUUSD 5M";


            console.log(
              "NEW SIGNAL DETECTED"
            );


            console.log(
              message
            );


            await sendNotification(
              message
            );


            console.log(
              "NOTIFICATION SENT"
            );


            console.log(
              "================================"
            );
          }


          main()
            .catch(
              error => {

                console.error(
                  "BOT ERROR:",
                  error
                );

                process.exit(1);
              }
            );

          NODE