name: XAUUSD Signal Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest

    steps:
      - name: Analyze XAUUSD
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}

        run: |
          node <<'NODE'

          const PRICE_URL =
            "https://biquote.io/api/XAUUSD?allowStale=true";

          const OHLC_URL =
            "https://biquote.io/api/XAUUSD/ohlc?interval=5m&limit=300";

          const APP_ID =
            "092fc306-c2ab-4a85-a3f9-ff8b50dd8833";

          const SUBSCRIPTION_ID =
            "cdcd03a6-7830-4621-9178-8fb9cc306b8e";

          const API_KEY =
            process.env.ONESIGNAL_REST_API_KEY;


          async function getJSON(url) {

            const r = await fetch(url);

            if (!r.ok) {
              throw new Error(
                `HTTP ${r.status} - ${url}`
              );
            }

            return await r.json();
          }


          function sma(data, period) {

            if (data.length < period)
              return null;

            let sum = 0;

            for (
              let i = data.length - period;
              i < data.length;
              i++
            ) {
              sum += data[i];
            }

            return sum / period;
          }


          function ema(data, period) {

            if (data.length < period)
              return null;

            const k = 2 / (period + 1);

            let value =
              sma(
                data.slice(0, period),
                period
              );

            for (
              let i = period;
              i < data.length;
              i++
            ) {

              value =
                data[i] * k +
                value * (1 - k);
            }

            return value;
          }


          function rsi(data, period = 14) {

            if (data.length < period + 1)
              return 50;

            let gain = 0;
            let loss = 0;

            for (
              let i = data.length - period;
              i < data.length;
              i++
            ) {

              const change =
                data[i] - data[i - 1];

              if (change > 0)
                gain += change;
              else
                loss += Math.abs(change);
            }

            if (loss === 0)
              return 100;

            const rs =
              gain / loss;

            return 100 -
              100 / (1 + rs);
          }


          function getSignal(closes) {

            let score = 0;


            const e9 =
              ema(closes, 9);

            const e21 =
              ema(closes, 21);


            if (
              e9 !== null &&
              e21 !== null
            ) {

              if (e9 > e21)
                score += 2;

              if (e9 < e21)
                score -= 2;
            }


            const s20 =
              sma(closes, 20);

            const s50 =
              sma(closes, 50);


            if (
              s20 !== null &&
              s50 !== null
            ) {

              if (s20 > s50)
                score += 2;

              if (s20 < s50)
                score -= 2;
            }


            const r =
              rsi(closes, 14);


            if (r > 55)
              score += 1;

            if (r < 45)
              score -= 1;


            let signal = "WAIT";


            if (score >= 4)
              signal = "BUY";


            if (score <= -4)
              signal = "SELL";


            return {
              score,
              signal,
              rsi: r
            };
          }


          function getLevels(
            bars,
            price,
            signal
          ) {

            const recent =
              bars.slice(-60);


            const highs =
              recent.map(
                x => x.high
              );


            const lows =
              recent.map(
                x => x.low
              );


            const resistance =
              Math.max(...highs);


            const support =
              Math.min(...lows);


            let sl;
            let tp1;
            let tp2;


            if (signal === "BUY") {

              sl =
                support < price
                ? support - 1.5
                : price - 5;


              const risk =
                price - sl;


              tp1 =
                price + risk * 1.5;


              tp2 =
                price + risk * 2.2;

            } else {

              sl =
                resistance > price
                ? resistance + 1.5
                : price + 5;


              const risk =
                sl - price;


              tp1 =
                price - risk * 1.5;


              tp2 =
                price - risk * 2.2;
            }


            return {
              sl,
              tp1,
              tp2
            };
          }


          async function sendNotification(message) {

            if (!API_KEY) {

              throw new Error(
                "ONESIGNAL_REST_API_KEY is missing"
              );
            }


            const r =
              await fetch(
                "https://api.onesignal.com/notifications",
                {
                  method: "POST",

                  headers: {
                    "Authorization":
                      "Key " + API_KEY,

                    "Content-Type":
                      "application/json"
                  },

                  body: JSON.stringify({

                    app_id:
                      APP_ID,

                    include_subscription_ids:
                      [
                        SUBSCRIPTION_ID
                      ],

                    headings: {
                      en:
                        "XAUUSD Signal Bot"
                    },

                    contents: {
                      en:
                        message
                    }

                  })
                }
              );


            const responseText =
              await r.text();


            console.log(
              "OneSignal:",
              responseText
            );


            if (!r.ok) {

              throw new Error(
                "OneSignal error " +
                r.status
              );
            }
          }


          async function main() {

            console.log(
              "================================"
            );

            console.log(
              "XAUUSD SIGNAL BOT"
            );

            console.log(
              "================================"
            );


            const priceData =
              await getJSON(
                PRICE_URL
              );


            const price =
              Number(
                priceData.mid ??
                priceData.bid ??
                priceData.ask ??
                priceData.last
              );


            if (!Number.isFinite(price)) {

              throw new Error(
                "XAUUSD price not found"
              );
            }


            console.log(
              "XAUUSD:",
              price
            );


            const data =
              await getJSON(
                OHLC_URL
              );


            if (
              !data.bars ||
              !Array.isArray(
                data.bars
              )
            ) {

              throw new Error(
                "OHLC data not found"
              );
            }


            const bars =
              data.bars
                .filter(
                  x => !x.isOpen
                )
                .map(
                  x => ({
                    open:
                      Number(x.open),

                    high:
                      Number(x.high),

                    low:
                      Number(x.low),

                    close:
                      Number(x.close)
                  })
                );


            if (bars.length < 110) {

              throw new Error(
                "Not enough candles: " +
                bars.length
              );
            }


            const closes =
              bars.map(
                x => x.close
              );


            const current =
              getSignal(
                closes
              );


            const previousCloses =
              closes.slice(
                0,
                closes.length - 1
              );


            const previous =
              getSignal(
                previousCloses
              );


            console.log(
              "Current score:",
              current.score
            );


            console.log(
              "Previous score:",
              previous.score
            );


            console.log(
              "Current signal:",
              current.signal
            );


            console.log(
              "Previous signal:",
              previous.signal
            );


            if (
              current.signal === "WAIT"
            ) {

              console.log(
                "WAIT - no notification"
              );

              return;
            }


            if (
              current.signal ===
              previous.signal
            ) {

              console.log(
                "Same signal - no notification"
              );

              return;
            }


            const trade =
              getLevels(
                bars,
                price,
                current.signal
              );


            const confidence =
              Math.min(
                95,
                50 +
                Math.abs(
                  current.score
                ) * 7
              );


            const message =

              (
                current.signal === "BUY"
                ? "🟢 XAUUSD BUY"
                : "🔴 XAUUSD SELL"
              )

              + "\n\n"

              + "📍 Entry: "
              + price.toFixed(2)

              + "\n🛑 SL: "
              + trade.sl.toFixed(2)

              + "\n🎯 TP1: "
              + trade.tp1.toFixed(2)

              + "\n🎯 TP2: "
              + trade.tp2.toFixed(2)

              + "\n💪 Confidence: "
              + confidence
              + "%"

              + "\n📊 RSI: "
              + current.rsi.toFixed(1)

              + "\n📈 Score: "
              + current.score

              + "\n\n⏰ XAUUSD 5M";


            console.log(
              "NEW SIGNAL!"
            );


            console.log(
              message
            );


            await sendNotification(
              message
            );


            console.log(
              "Notification sent successfully!"
            );
          }


          main()
            .catch(
              error => {

                console.error(
                  "BOT ERROR:",
                  error
                );

                process.exit(1);
              }
            );

          NODE