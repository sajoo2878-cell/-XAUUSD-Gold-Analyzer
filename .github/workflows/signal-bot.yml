name: XAUUSD Signal Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest

    steps:
      - name: Analyze XAUUSD and send signal
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          node <<'NODE'
          const PRICE_URL =
            "https://biquote.io/api/XAUUSD?allowStale=true";

          const OHLC_URL =
            "https://biquote.io/api/XAUUSD/ohlc?interval=5m&limit=300";

          const NEWS_URL =
            "https://biquote.io/api/calendar?importance=high&limit=50";

          const APP_ID =
            "092fc306-c2ab-4a85-a3f9-ff8b50dd8833";

          const SUBSCRIPTION_ID =
            "cdcd03a6-7830-4621-9178-8fb9cc306b8e";

          const API_KEY =
            process.env.ONESIGNAL_REST_API_KEY;


          async function getJSON(url) {
            const response = await fetch(url, {
              cache: "no-store"
            });

            if (!response.ok) {
              throw new Error(
                `${url} HTTP ${response.status}`
              );
            }

            return await response.json();
          }


          function sma(data, period) {

            if (!data || data.length < period) {
              return null;
            }

            let sum = 0;

            for (
              let i = data.length - period;
              i < data.length;
              i++
            ) {
              sum += data[i];
            }

            return sum / period;
          }


          function ema(data, period) {

            if (!data || data.length < period) {
              return null;
            }

            const k = 2 / (period + 1);

            let value =
              sma(
                data.slice(0, period),
                period
              );

            for (
              let i = period;
              i < data.length;
              i++
            ) {
              value =
                data[i] * k +
                value * (1 - k);
            }

            return value;
          }


          function rsi(data, period = 14) {

            if (
              !data ||
              data.length < period + 1
            ) {
              return 50;
            }

            let gains = 0;
            let losses = 0;

            for (
              let i = data.length - period;
              i < data.length;
              i++
            ) {

              const change =
                data[i] - data[i - 1];

              if (change > 0) {
                gains += change;
              } else {
                losses += Math.abs(change);
              }
            }

            if (losses === 0) {
              return 100;
            }

            const rs = gains / losses;

            return 100 - (100 / (1 + rs));
          }


          function trend(closes, price) {

            if (closes.length < 30) {
              return 0;
            }

            const fast =
              ema(closes, 9);

            const slow =
              ema(closes, 21);

            if (
              fast === null ||
              slow === null
            ) {
              return 0;
            }

            const difference =
              fast - slow;

            const threshold =
              price * 0.00012;

            if (difference > threshold) {
              return 1;
            }

            if (difference < -threshold) {
              return -1;
            }

            return 0;
          }


          function calculateScore(closes, price) {

            const t5 =
              trend(closes, price);

            let t15 = t5;
            let t30 = t5;
            let t60 = t5;

            const currentRSI =
              rsi(closes, 14);

            if (currentRSI > 58) {
              // 5M bullish
            } else if (currentRSI < 42) {
              // 5M bearish
            }

            const sma20 =
              sma(closes, 20);

            const sma50 =
              sma(closes, 50);

            if (
              sma20 !== null &&
              sma50 !== null
            ) {

              if (sma20 > sma50) {
                t15 = 1;
              } else if (sma20 < sma50) {
                t15 = -1;
              }
            }

            if (closes.length >= 100) {

              const last100 =
                closes.slice(-100);

              const m50 =
                sma(last100, 50);

              const m100 =
                sma(last100, 100);

              if (
                m50 !== null &&
                m100 !== null
              ) {

                if (m50 > m100) {
                  t30 = 1;
                } else if (m50 < m100) {
                  t30 = -1;
                }
              }
            }

            const last =
              closes[closes.length - 1];

            const first =
              closes[
                Math.max(
                  0,
                  closes.length - 100
                )
              ];

            if (last > first) {
              t60 = 1;
            } else if (last < first) {
              t60 = -1;
            }

            let score = 0;

            if (t5 > 0) score += 1;
            if (t5 < 0) score -= 1;

            if (t15 > 0) score += 2;
            if (t15 < 0) score -= 2;

            if (t30 > 0) score += 1;
            if (t30 < 0) score -= 1;

            if (t60 > 0) score += 1;
            if (t60 < 0) score -= 1;

            if (currentRSI > 55) {
              score += 1;
            } else if (currentRSI < 45) {
              score -= 1;
            }

            const fast =
              ema(closes, 9);

            const slow =
              ema(closes, 21);

            if (
              fast !== null &&
              slow !== null
            ) {

              if (fast > slow) {
                score += 1;
              } else if (fast < slow) {
                score -= 1;
              }
            }

            return {
              score,
              rsi: currentRSI,
              t5,
              t15,
              t30,
              t60
            };
          }


          function getLevels(bars) {

            const recent =
              bars.slice(-60);

            const highs =
              recent.map(c => c.high);

            const lows =
              recent.map(c => c.low);

            const sortedHighs =
              [...highs].sort(
                (a, b) => b - a
              );

            const sortedLows =
              [...lows].sort(
                (a, b) => a - b
              );

            return {
              r1: sortedHighs[0],
              r2: sortedHighs[
                Math.min(
                  5,
                  sortedHighs.length - 1
                )
              ],
              s1: sortedLows[0],
              s2: sortedLows[
                Math.min(
                  5,
                  sortedLows.length - 1
                )
              ]
            };
          }


          function tradeLevels(
            signal,
            price,
            levels
          ) {

            let sl = 0;
            let tp1 = 0;
            let tp2 = 0;

            if (signal === "BUY") {

              if (
                levels.s1 &&
                levels.s1 < price
              ) {
                sl =
                  levels.s1 - 1.5;
              } else {
                sl =
                  price - 5;
              }

              const risk =
                price - sl;

              tp1 =
                price + risk * 1.5;

              tp2 =
                price + risk * 2.2;
            }


            if (signal === "SELL") {

              if (
                levels.r1 &&
                levels.r1 > price
              ) {
                sl =
                  levels.r1 + 1.5;
              } else {
                sl =
                  price + 5;
              }

              const risk =
                sl - price;

              tp1 =
                price - risk * 1.5;

              tp2 =
                price - risk * 2.2;
            }

            return {
              entry: price,
              sl,
              tp1,
              tp2
            };
          }


          function money(value) {
            return Number(value).toFixed(2);
          }


          async function sendNotification(message) {

            if (!API_KEY) {
              throw new Error(
                "ONESIGNAL_REST_API_KEY is missing"
              );
            }

            const response =
              await fetch(
                "https://api.onesignal.com/notifications",
                {
                  method: "POST",

                  headers: {
                    "Authorization":
                      "Key " + API_KEY,

                    "Content-Type":
                      "application/json"
                  },

                  body: JSON.stringify({

                    app_id: APP_ID,

                    include_subscription_ids:
                      [SUBSCRIPTION_ID],

                    headings: {
                      en: "XAUUSD Signal Bot"
                    },

                    contents: {
                      en: message
                    }
                  })
                }
              );

            const text =
              await response.text();

            if (!response.ok) {

              throw new Error(
                "OneSignal " +
                response.status +
                ": " +
                text
              );
            }

            console.log(
              "OneSignal response:",
              text
            );
          }


          async function main() {

            console.log(
              "================================"
            );

            console.log(
              "XAUUSD SIGNAL BOT"
            );

            console.log(
              "================================"
            );


            const priceData =
              await getJSON(PRICE_URL);

            const price =
              Number(
                priceData.mid ??
                priceData.bid ??
                priceData.ask ??
                priceData.last
              );


            if (!Number.isFinite(price)) {
              throw new Error(
                "XAUUSD price not found"
              );
            }


            console.log(
              "Price:",
              price
            );


            const ohlc =
              await getJSON(OHLC_URL);


            if (
              !ohlc ||
              !Array.isArray(ohlc.bars)
            ) {
              throw new Error(
                "OHLC bars not found"
              );
            }


            let bars =
              ohlc.bars
              .map(c => ({
                time:
                  Date.parse(c.openTime),

                open:
                  Number(c.open),

                high:
                  Number(c.high),

                low:
                  Number(c.low),

                close:
                  Number(c.close),

                isOpen:
                  Boolean(c.isOpen)
              }))
              .filter(c =>
                Number.isFinite(c.time) &&
                Number.isFinite(c.open) &&
                Number.isFinite(c.high) &&
                Number.isFinite(c.low) &&
                Number.isFinite(c.close)
              )
              .sort(
                (a, b) =>
                  a.time - b.time
              );


            /*
             * نستخدم الشموع المغلقة فقط
             */

            bars =
              bars.filter(
                c => !c.isOpen
              );


            if (bars.length < 110) {

              throw new Error(
                "Not enough closed candles: " +
                bars.length
              );
            }


            const closes =
              bars.map(
                c => c.close
              );


            /*
             * التحليل الحالي
             */

            const current =
              calculateScore(
                closes,
                price
              );


            /*
             * تحليل الشمعة السابقة
             *
             * حتى نرسل الإشعار عند
             * ظهور الإشارة الجديدة فقط.
             */

            const previousCloses =
              closes.slice(
                0,
                closes.length - 1
              );


            const previous =
              calculateScore(
                previousCloses,
                price
              );


            let signal =
              "WAIT";


            if (current.score >= 4) {
              signal = "BUY";
            }

            if (current.score <= -4) {
              signal = "SELL";
            }


            let previousSignal =
              "WAIT";


            if (previous.score >= 4) {
              previousSignal = "BUY";
            }

            if (previous.score <= -4) {
              previousSignal = "SELL";
            }


            console.log(
              "Current score:",
              current.score
            );

            console.log(
              "Previous score:",
              previous.score
            );

            console.log(
              "Signal:",
              signal
            );


            /*
             * إذا الإشارة كانت موجودة أصلاً
             * بالشمعة السابقة، لا نرسل سبام.
             */

            if (
              signal === "WAIT" ||
              signal === previousSignal
            ) {

              console.log(
                "No NEW signal. No notification."
              );

              return;
            }


            const confidence =
              Math.min(
                95,
                50 +
                Math.abs(
                  current.score
                ) * 7
              );


            const levels =
              getLevels(bars);


            const trade =
              tradeLevels(
                signal,
                price,
                levels
              );


            /*
             * الأخبار
             */

            let newsText =
              "لا توجد بيانات أخبار قوية حالياً";


            try {

              const news =
                await getJSON(
                  NEWS_URL
                );


              if (
                Array.isArray(news) &&
                news.length > 0
              ) {

                const names =
                  news
                  .slice(0, 3)
                  .map(
                    item =>
                      item.name ||
                      item.title ||
                      item.event ||
                      "خبر اقتصادي"
                  );

                newsText =
                  names.join(" | ");
              }

            } catch (error) {

              console.log(
                "News unavailable:",
                error.message
              );
            }


            const trend =
              signal === "BUY"
              ? "UP ↑"
              : "DOWN ↓";


            const momentum =
              current.rsi >= 60
              ? "STRONG UP ↑"
              : current.rsi >= 53
              ? "UP ↑"
              : current.rsi <= 40
              ? "STRONG DOWN ↓"
              : current.rsi <= 47
              ? "DOWN ↓"
              : "NEUTRAL";


            const message =

              (signal === "BUY"
                ? "🟢 XAUUSD BUY SIGNAL"
                : "🔴 XAUUSD SELL SIGNAL") +

              "\n\n" +

              "📍 Entry: " +
              money(trade.entry) +

              "\n🛑 SL: " +
              money(trade.sl) +

              "\n🎯 TP1: " +
              money(trade.tp1) +

              "\n🎯 TP2: " +
              money(trade.tp2) +

              "\n💪 Confidence: " +
              confidence +
              "%" +

              "\n📊 Trend: " +
              trend +

              "\n⚡ Momentum: " +
              momentum +

              "\n📈 5M: " +
              (current.t5 > 0
                ? "UP"
                : current.t5 < 0
                ? "DOWN"
                : "SIDEWAYS") +

              "\n📈 15M: " +
              (current.t15 > 0
                ? "UP"
                : current.t15 < 0
                ? "DOWN"
                : "SIDEWAYS") +

              "\n📈 30M: " +
              (current.t30 > 0
                ? "UP"
                : current.t30 < 0
                ? "DOWN"
                : "SIDEWAYS") +

              "\n📈 1H: " +
              (current.t60 > 0
                ? "UP"
                : current.t60 < 0
                ? "DOWN"
                : "SIDEWAYS") +

              "\n📰 News: " +
              newsText +

              "\n\n⏰ XAUUSD • 5M";


            console.log(
              "NEW SIGNAL DETECTED"
            );

            console.log(
              message
            );


            await sendNotification(
              message
            );


            console.log(
              "================================"
            );

            console.log(
              "NOTIFICATION SENT SUCCESSFULLY"
            );

            console.log(
              "================================"
            );
          }


          main()
            .catch(error => {

              console.error(
                "BOT ERROR:",
                error
              );

              process.exit(1);
            });

          NODE