name: XAUUSD Signal Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Send test notification
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          curl --fail-with-body --request POST \
            --url https://api.onesignal.com/notifications \
            --header "Authorization: Key $ONESIGNAL_REST_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{
              "app_id": "092fc306-c2ab-4a85-a3f9-ff8b50dd8833",
              "included_segments": ["Subscribed Users"],
              "headings": {"en": "🟢 XAUUSD Signal Bot"},
              "contents": {"en": "🔔 إشعار تجريبي ناجح. البوت متصل بـ OneSignal."}
            }'